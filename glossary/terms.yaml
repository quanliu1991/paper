# 个人术语词典
# level: known（熟词，速览中裸奔不解释）/ learning（学习中，首次出现带解释）/ unknown（生词，必解释）
# 用户口头校正：「这词我熟」→ known；「这个词不懂」→ unknown
# Agent 维护规则：精读/速览中遇到未收录的领域核心词 → 自动加为 learning

terms:
  KV Cache:
    level: learning
    解释: 推理时缓存的键值向量，避免重复计算，是长上下文显存占用的主要来源
    相关: [kv-cache]
  PagedAttention:
    level: learning
    解释: vLLM 的核心技术，像操作系统分页一样管理 KV cache，减少显存碎片
    相关: [kv-cache, serving-system]
  Prefill:
    level: learning
    解释: 推理的第一阶段，并行处理整段输入 prompt，计算密集
    相关: [serving-system]
  Decode:
    level: learning
    解释: 推理的第二阶段，逐 token 生成输出，访存密集，是解码延迟主因
    相关: [serving-system]
  投机解码 (Speculative Decoding):
    level: learning
    解释: 用小模型快速起草多个 token、大模型一次验证的加速方法，数学上不损失精度
    相关: [speculative-decoding]
  Draft Model:
    level: learning
    解释: 投机解码中负责快速起草的小模型
    相关: [speculative-decoding]
  连续批处理 (Continuous Batching):
    level: learning
    解释: 请求级动态入队/出队的批调度，序列完成即释放槽位，大幅提高吞吐
    相关: [serving-system, parallelism-scheduling]
  前缀缓存 (Prefix Caching):
    level: learning
    解释: 相同前缀（如 system prompt）的 KV 直接复用，跳过重复 prefill
    相关: [kv-cache, serving-system]
  Prefill-Decode 分离 (Disaggregated Inference):
    level: learning
    解释: prefill 与 decode 部署到不同 GPU/节点各自扩缩，消除互相干扰
    相关: [serving-system, parallelism-scheduling]
  量化 (Quantization):
    level: learning
    解释: 把 FP16 权重/激活压到低比特（INT8/INT4/FP4）以省显存提速度
    相关: [quantization-compression]
  GPTQ:
    level: unknown
    解释: 基于 Hessian 信息的训练后权重量化方法，常用于 4-bit 压缩
    相关: [quantization-compression]
  AWQ:
    level: unknown
    解释: 激活感知的权重量化，保护少量重要通道，W4 精度损失小
    相关: [quantization-compression]
  W2A4:
    level: unknown
    解释: 权重 2-bit + 激活 4-bit 的极低比特量化配置
    相关: [quantization-compression]
  MoE (Mixture-of-Experts):
    level: learning
    解释: 每层只激活部分专家的稀疏架构，总参数大但单 token 计算量小
    相关: [moe-inference, models]
  Expert Parallel:
    level: unknown
    解释: MoE 专家分布到多卡/多机的并行方式，通信含 all-to-all
    相关: [moe-inference, parallelism-scheduling]
  张量并行 (Tensor Parallelism):
    level: learning
    解释: 单层权重矩阵切到多卡分块计算，通信量大需高速互联
    相关: [parallelism-scheduling]
  流水线并行 (Pipeline Parallelism):
    level: learning
    解释: 模型按层切分到多卡，像流水线一样传递，通信量小但有气泡
    相关: [parallelism-scheduling]
  FlashAttention:
    level: learning
    解释: 用 tiling 重排注意力计算避免显式构建 N² 矩阵的 IO 高效实现
    相关: [kv-cache, serving-system]
  吞吐 (Throughput):
    level: known
    解释: 单位时间处理的 token 数/请求数
    相关: [serving-system]
  延迟 (Latency):
    level: known
    解释: 单请求首 token 时间(TTFT)或每 token 时间(TPOT)
    相关: [serving-system]
  TTFT:
    level: unknown
    解释: Time To First Token，首 token 延迟，主要由 prefill 决定
    相关: [serving-system]
  TPOT:
    level: unknown
    解释: Time Per Output Token，稳态每 token 生成时间，主要由 decode 决定
    相关: [serving-system]
  N:M 稀疏 (N:M Sparsity):
    level: unknown
    解释: 每 M 个元素只保留 N 个非零的结构化稀疏，硬件可直接加速
    相关: [quantization-compression]
  蒸馏 (Distillation):
    level: known
    解释: 用大模型输出训练小模型的知识迁移方法
    相关: [training, quantization-compression]
  剪枝 (Pruning):
    level: known
    解释: 删除不重要权重/通道/层以压缩模型
    相关: [quantization-compression]
  vLLM:
    level: known
    解释: 最流行的开源 LLM 推理引擎，PagedAttention 的发源地
    相关: [serving-system]
  SGLang:
    level: learning
    解释: 高性能推理引擎，RadixAttention 前缀缓存与结构化生成控制流
    相关: [serving-system]
  CUDA Kernel:
    level: known
    解释: GPU 上的底层计算函数，融合 kernel 减少访存
    相关: [serving-system]
  Triton:
    level: learning
    解释: OpenAI 的 GPU kernel 编写语言/编译器，Python 语法写高性能算子
    相关: [serving-system]
  图编译 (Graph Compilation):
    level: learning
    解释: 把计算图优化重写（融合/重排）再生成代码的编译技术
    相关: [serving-system]
  Offloading:
    level: learning
    解释: 权重/KV 在 GPU 显存与 CPU 内存/SSD 间分层放置
    相关: [kv-cache, serving-system]
  长上下文 (Long Context):
    level: known
    解释: 128K+ token 输入场景，核心挑战是 KV 显存与注意力二次复杂度
    相关: [long-context-vlm]
  线性注意力 (Linear Attention):
    level: learning
    解释: 把注意力复杂度从 O(N²) 降到 O(N) 的近似方法（如 Mamba/RetNet）
    相关: [long-context-vlm, models]
  Chunk-wise Prefill:
    level: unknown
    解释: 把长 prefill 切成块与 decode 混批，避免长请求独占机器
    相关: [serving-system]
  Goodput:
    level: unknown
    解释: 满足 SLO 的有效吞吐，惩罚超时请求
    相关: [serving-system]
  SLO:
    level: unknown
    解释: Service Level Objective，服务等级目标（如 P99 延迟上限）
    相关: [serving-system]
  CUDA Graph:
    level: learning
    解释: 录制一次 kernel 启动序列后重放，消除 launch 开销，decode 提速明显
    相关: [serving-system]
  Fused Kernel:
    level: learning
    解释: 多个算子融合成一个 kernel，减少中间结果访存
    相关: [serving-system]
  RadixAttention:
    level: unknown
    解释: SGLang 的前缀树缓存，按 radix tree 共享任意前缀的 KV
    相关: [kv-cache, serving-system]
  Rollout:
    level: learning
    解释: RL 训练中用当前策略生成推理轨迹的阶段，常与训练分离部署
    相关: [serving-system, training]
  Refit:
    level: unknown
    解释: 训练集群新权重同步到推理/serving 集群的过程
    相关: [serving-system]
  EAGLE:
    level: unknown
    解释: 知名投机解码方法系列，用特征级联预测 draft token
    相关: [speculative-decoding]
  Chain-of-Thought (CoT):
    level: known
    解释: 思维链，模型分步推理再给答案；认知推理方向核心概念
    相关: [reasoning]
  Test-time Scaling:
    level: learning
    解释: 推理时增加计算（更长思考/多次采样）换取准确率
    相关: [reasoning]
  Token-level Routing:
    level: learning
    解释: token 级模型路由——每个 token 都可切换生成模型，比 query 级路由粒度细得多
    相关: [serving-system]
    首见: 2026-10-10 TokenRouter
  Query-level Routing:
    level: learning
    解释: query 级模型路由——整条请求只绑一个模型，判断一刀切；生产系统主流做法（RouteLLM 等）
    相关: [serving-system]
    首见: 2026-10-10 TokenRouter
  R2R (Route-to-Reason):
    level: learning
    解释: token 路由算法，仅 5% 难 token 给 32B 模型即可追平其质量
    相关: [serving-system]
    首见: 2026-10-10 TokenRouter
  Step Desynchronization:
    level: learning
    解释: 多模型 serving 中各模型单步延迟不同，同步批处理会拖慢快模型
    相关: [serving-system]
    首见: 2026-10-10 TokenRouter
  Batch Admission Delay:
    level: learning
    解释: 请求到达时目标模型正忙，须等下一批才能入队的延迟，token 路由下尤其严重
    相关: [serving-system, parallelism-scheduling]
    首见: 2026-10-10 TokenRouter
  Verification (投机解码):
    level: learning
    解释: 投机解码中 target 模型一次前向同时验证多个 draft token 的环节，前向代价高
    相关: [speculative-decoding]
    首见: 2026-10-10 DLoop
  Loop-aware Training:
    level: learning
    解释: 让 draft 模型适应「以自身 hidden states 为输入继续起草」这一新分布的轻量训练
    相关: [speculative-decoding]
    首见: 2026-10-10 DLoop
  RoPE:
    level: learning
    解释: 旋转位置编码，把位置信息以旋转矩阵写进 Q/K；KV 复用时可按新位置重做旋转实现对齐
    相关: [kv-cache, models]
    首见: 2026-10-12 KV-Repurpose
  PIC (Position-Independent Caching):
    level: learning
    解释: 位置无关缓存——KV 段脱离原前缀在新位置复用（CacheBlend/EPIC 等），与 prefix caching 相对
    相关: [kv-cache]
    首见: 2026-10-12 KV-Repurpose
  LMCache:
    level: learning
    解释: vLLM 的 KV cache 扩展层，支持分层存储，但复用仍以精确前缀匹配为主
    相关: [kv-cache, serving-system]
    首见: 2026-10-12 KV-Repurpose
  dLLM (扩散语言模型):
    level: learning
    解释: 用双向扩散过程并行生成 token 的语言模型（LLaDA/Dream），整段去噪反复前向、块扩散带 KV cache
    相关: [models, quantization-compression]
    首见: 2026-10-12 SoloQ
  MLA (Multi-Head Latent Attention):
    level: learning
    解释: DeepSeek 式潜在注意力，KV cache 压成低秩潜在向量；内容/RoPE 双路结构给量化带来独特难题
    相关: [kv-cache, models]
    首见: 2026-10-12 QuantMLA
  NVFP4:
    level: unknown
    解释: NVIDIA 硬件原生的 FP4 浮点格式，量化部署可直接吃满 tensor core
    相关: [quantization-compression]
    首见: 2026-10-12 SoloQ
  BPE (Byte-Pair Encoding):
    level: learning
    解释: 从字节对逐步合并出 token 的分词算法，GPT-2/Llama/Qwen 等主流 tokenizer 的核心；合并在 pre-token 内按 rank 有序进行
    相关: [serving-system]
    首见: 2026-10-12 GraphTok
  Pre-tokenization:
    level: learning
    解释: BPE 前用正则把文本切成 pre-token 小段、合并不许跨界的一步；删掉它会改变最终 token 序列
    相关: [serving-system]
    首见: 2026-10-12 GraphTok
  gigatoken:
    level: learning
    解释: 目前最强的 CPU BPE tokenizer 库（Rust，SIMD + pre-token 缓存），serving 论文常见最强 CPU 基线
    相关: [serving-system]
    首见: 2026-10-12 GraphTok
  RLHF:
    level: learning
    解释: 基于人类反馈的 RL——偏好数据训 reward model 打分；灵活但可被 reward hacking
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  RLVR:
    level: learning
    解释: 可验证奖励的 RL——规则验证器（答案匹配/单测）打分，防作弊支撑大规模训练，DeepSeek-R1 路线
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  Advantage (优势函数):
    level: learning
    解释: A = Q − V，动作比状态平均预期好多少；策略梯度的核心学习信号
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  GAE (广义优势估计):
    level: learning
    解释: 不同步数的 TD 优势估计按 λ 指数加权混合，调偏差-方差，常用 λ=0.95
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  Reward Hacking:
    level: learning
    解释: 模型学会骗打分器而非把任务做对；神经 reward model 的固有风险
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  Clip (PPO/GRPO 截断):
    level: learning
    解释: importance ratio 限制在 [1−ε, 1+ε]，拦「锦上添花」不拦「落井下石」的悲观下界
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  GSPO:
    level: learning
    解释: 序列级（几何平均）importance ratio + clip 的 GRPO 变体，Qwen3 训练采用，长序列/大 MoE 更稳
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  DAPO:
    level: learning
    解释: GRPO 补丁套餐——clip-higher、dynamic sampling、token 级聚合、overlong filtering
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  TIS (截断重要性采样):
    level: learning
    解释: 修训练引擎与推理引擎 token 概率不一致的 importance 修正，verl/OpenInstruct 已内置
    相关: [training, serving-system]
    首见: 2026-10-14 LLM RL Complete Guide
  CISPO:
    level: learning
    解释: clip 后 ratio 做 stop-gradient 权重而非梯度归零，保护 "wait"/"aha" 等稀有反思 token，MiniMax-M1 采用
    相关: [training]
    首见: 2026-10-14 LLM RL Complete Guide
  Execution Bubble:
    level: learning
    解释: 调度中本可被合法工作填上的空闲批位；混合架构下 head-of-line blocking 的产物
    相关: [serving-system]
    首见: 2026-10-14 RadixFlow
  Hybrid LLM:
    level: learning
    解释: linear attention（Mamba2 等）与 full attention 交错的架构（Qwen3.5/Nemotron v2），KV cache 外还有 recurrent state 需要 prefix 复用时同步
    相关: [serving-system, kv-cache, models]
    首见: 2026-10-14 RadixFlow
  State-ready Traversal:
    level: learning
    解释: 扫描等待队列时只阻塞同轮依赖的消费者、继续检查后续就绪分支的调度规则
    相关: [serving-system]
    首见: 2026-10-14 RadixFlow
  Behavior-Aligned Compression:
    level: learning
    解释: 压缩目标盯最终行为（注意力分布/输出）而非中间量重建误差；softmax 曲率项让目标 query-aware
    相关: [kv-cache, quantization-compression]
    首见: 2026-10-14 BELT
  Learned Rank Allocation:
    level: learning
    解释: 跨层跨 head 学 rank 分配——软门控 top-k 训练 + 硬预算部署，替代统一 rank 或启发式敏感度搜索
    相关: [kv-cache, quantization-compression]
    首见: 2026-10-14 BELT
  Palu:
    level: learning
    解释: 低秩 KV cache 压缩与量化的代表方法系列（含 Palu-Q 量化器）
    相关: [kv-cache]
    首见: 2026-10-14 BELT
  STAR-KV:
    level: learning
    解释: 自适应 rank 控制的 SOTA 低秩 KV 压缩方法（学习块阈值）
    相关: [kv-cache]
    首见: 2026-10-14 BELT
  Self-Speculative Decoding:
    level: learning
    解释: 用目标模型自身的变体（跳层/稀疏注意力/量化）做 drafter 的投机解码，免训练独立小模型
    相关: [speculative-decoding]
    首见: 2026-10-14 S3R
  Behavior Policy Mismatch:
    level: learning
    解释: RL 中采样策略与被优化策略不一致（稀疏/低精度/过期 drafter 都会引起），GRPO 类组相对算法尤其敏感
    相关: [training, speculative-decoding]
    首见: 2026-10-14 S3R
  Block Efficiency:
    level: learning
    解释: 投机解码每轮平均产出 token 数（含修正/bonus token），决定验证成本能否被摊薄
    相关: [speculative-decoding]
    首见: 2026-10-14 S3R
  AIMD 调度:
    level: learning
    解释: 加性增、乘性减的并发/速率控制（TCP 拥塞控制同款），S3R 用于 RL rollout 的 KV 显存压力自适应
    相关: [serving-system, parallelism-scheduling]
    首见: 2026-10-14 S3R
  KV Concentration:
    level: learning
    解释: 异步 rollout 把同样的 KV 处理压进更少 decode step，单步 KV 负载结构性增大；回答长度方差越大越严重
    相关: [kv-cache, serving-system]
    首见: 2026-10-15 KV4-RL
  Attention Sink:
    level: learning
    解释: 模型对序列开头少数 token 的异常高注意力，量化/压缩 KV 时开头位置需重点保护
    相关: [kv-cache, quantization-compression]
    首见: 2026-10-15 KV4-RL
  Calibration-free 量化:
    level: learning
    解释: 不靠离线校准集、对每个新向量在线算量化参数，策略/分布漂移时天然免疫
    相关: [quantization-compression, kv-cache]
    首见: 2026-10-15 KV4-RL
  Foresight Drafting:
    level: learning
    解释: 验证未结束时预测目标 hidden state 和验证结局，提前起草下一块，使起草脱离投机解码关键路径
    相关: [speculative-decoding]
    首见: 2026-10-15 JetSpec++
  Jacobi 迭代起草:
    level: learning
    解释: 把草稿块当输入反复前向，每轮用前面位置的结果修正后面位置，逼近逐 token 因果分解
    相关: [speculative-decoding]
    首见: 2026-10-15 JetSpec++
  Prefix-blind:
    level: learning
    解释: 并行预测各位置互看不到对方选的 token，可能拼出上下文不允许的组合（如「of problem」）
    相关: [speculative-decoding]
    首见: 2026-10-15 JetSpec++
  Self-efficacy:
    level: learning
    解释: 自我效能感——相信自己能做到的人真的 accomplish 更多；具体高目标优于「尽力就好」（Locke & Latham 目标设定研究）
    相关: [inference-other]
    首见: 2026-10-16 Ambitious with Models
  Goal beyond the goal:
    level: learning
    解释: 用 AI 的 Altitude 技巧核心自问——当前任务完成后你想发生什么，把任务改写成结果导向
    相关: [inference-other]
    首见: 2026-10-16 Ambitious with Models
  名词换动词 (Nouns to Verbs):
    level: learning
    解释: 任务重述技巧——把「做一个 X」换成「完成 X 所服务的动词性目的」，让跨领域方法自动浮现
    相关: [inference-other]
    首见: 2026-10-16 Ambitious with Models
